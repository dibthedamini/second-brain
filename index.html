nd tech"], "analysis": "The video presents a story about Alpamys Makazhan from Kazakhstan, who created a tool called 'Soup' to solve the problem of expensive AI model training. It opens with an animated stick figure representing him at a desk, then cuts to a narrator explaining that fine-tuning LLMs used to require thousands of dollars for data centers and custom scripts. The video shows screen recordings of terminal commands, GPU memory usage (3.32 GB), and the Soup GitHub repository, highlighting its features: one-command fine-tuning, no SSH/config hell, and ability to run on a 4GB laptop GPU — compared visually to a PlayStation 5 controller. It claims over 85,000 people are already using it, including developers training medical assistants and reasoning models locally. The narrator emphasizes that Soup…", "caption_fa": "شاید بزرگ‌ترین پیشرفت هوش مصنوعی، مدل هوشمندتر نباشد.\n\nشاید راحت‌تر کردن شخصی‌سازی مدل‌های موجود باشد.\n\nسال‌ها، فاین‌تیونینگ (fine-tuning) هوش مصنوعی یعنی گرافیک‌های گران‌قیمت (GPU)، اسکریپت‌های آموزشی پیچیده و دانش فنی‌ای که بیشتر آدم‌ها را قبل از شروع منصرف می‌کرد.\n\nابزارهایی مثل این دارند این را عوض می‌کنند.\n\nبه‌جای اینکه توسعه‌دهنده‌ها هر بخش از فرایند آموزش را دستی تنظیم کنند، می‌توانند بگویند چه می‌خواهند، داده‌شان را بدهند و بگذارند نرم‌افزار تنظیمات آموزشی را حول سخت‌افزاری که همین الان دارند بهینه کند.\n\nاین تغییر، از چیزی که به نظر می‌رسد خیلی بزرگ‌تر است.\n\nوقتی شخصی‌سازی هوش مصنوعی دیگر به دیتاسنتر نیاز نداشته باشد، تجربه و آزمون برای توسعه‌دهنده‌های مستقل، پژوهشگران و تیم‌های کوچک در دسترس می‌شود.\n\nآینده‌ی هوش مصنوعی فقط استفاده از مدلِ دیگران نخواهد بود.\n\nساختن نسخه‌ی خودت از یک مدل خواهد بود.\n\nکلمه‌ی SOUP را کامنت کن تا لینکش را برایت بفرستم.\n\n(ai, ai updates, artificial intelligence, technology, tech, tech updates, editing, designing, graphic designing, tech news, new gadget, gadgets, latest ai, ai tools, ai coding, ai coder, ai latest)\n\n#ai #artificialintelligence #aitools #ainews #aiupdates", "analysis_fa": "این ویدیو داستان آلپامیس ماکاژان از قزاقستان را روایت می‌کند که ابزاری به نام «سوپ» (Soup) ساخت تا مشکل پرهزینه‌بودن آموزش مدل‌های هوش مصنوعی را حل کند. ویدیو با یک فیگور انیمیشنی ساده از او پشت میز کار شروع می‌شود و بعد راوی توضیح می‌دهد که فاین‌تیونینگ مدل‌های زبانی بزرگ (LLM) قبلاً هزاران دلار هزینه‌ی دیتاسنتر و اسکریپت‌های اختصاصی می‌خواست. ویدیو ضبط صفحه‌ی دستورات ترمینال، میزان مصرف حافظه‌ی گرافیک (3.32 GB) و ریپازیتوری گیت‌هاب سوپ را نشان می‌دهد و ویژگی‌هایش را برجسته می‌کند: فاین‌تیونینگ با یک دستور، بدون دردسر SSH و کانفیگ، و امکان اجرا روی گرافیک ۴ گیگابایتی لپ‌تاپ — که از نظر بصری با کنترلر پلی‌استیشن ۵ مقایسه شده. ادعا می‌شود بیش از 85,000 نفر الان دارند از آن استفاده می‌کنند، از جمله توسعه‌دهنده‌هایی که دستیارهای پزشکی و مدل‌های استدلال را به‌صورت محلی آموزش می‌دهند.", "caption_display": "شاید بزرگ‌ترین پیشرفت هوش مصنوعی، مدل هوشمندتر نباشد.\n\nشاید راحت‌تر کردن شخصی‌سازی مدل‌های موجود باشد.\n\nسال‌ها، فاین‌تیونینگ (fine-tuning) هوش مصنوعی یعنی گرافیک‌های گران‌قیمت (GPU)، اسکریپت‌های آموزشی پیچیده و دانش فنی‌ای که بیشتر آدم‌ها را قبل از شروع منصرف می‌کرد.\n\nابزارهایی مثل این دارند این را عوض می‌کنند.\n\nبه‌جای اینکه توسعه‌دهنده‌ها هر بخش از فرایند آموزش را دستی تنظیم کنند، می‌توانند بگویند چه می‌خواهند، داده‌شان را بدهند و بگذارند نرم‌افزار تنظیمات آموزشی را حول سخت‌افزاری که همین الان دارند بهینه کند.\n\nاین تغییر، از چیزی که به نظر می‌رسد خیلی بزرگ‌تر است.\n\nوقتی شخصی‌سازی هوش مصنوعی دیگر به دیتاسنتر نیاز نداشته باشد، تجربه و آزمون برای توسعه‌دهنده‌های مستقل، پژوهشگران و تیم‌های کوچک در دسترس می‌شود.\n\nآینده‌ی هوش مصنوعی فقط استفاده از مدلِ دیگران نخواهد بود.\n\nساختن نسخه‌ی خودت از یک مدل خواهد بود.\n\nکلمه‌ی SOUP را کامنت کن تا لینکش را برایت بفرستم.\n\n(ai, ai updates, artificial intelligence, technology, tech, tech updates, editing, designing, graphic designing, tech news, new gadget, gadgets, latest ai, ai tools, ai coding, ai coder, ai latest)\n\n#ai #artificialintelligence #aitools #ainews #aiupdates", "excerpt": "شاید بزرگ‌ترین پیشرفت هوش مص const STATS = {"total": "۲۲", "n_collections": "۲", "updated": "۸ آبان ۱۴۰۵"};
const COLLECTIONS = ["ai and tech", "Immigration"];

function norm(s){return (s||"").replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\u064B-\u0652]/g,"").toLowerCase();}
let activeC="", query="";
document.getElementById("stats").innerHTML =
  "<span><b>"+STATS.total+"</b> پست</span><span>·</span>"+
  "<span><b>"+STATS.n_collections+"</b> کالکشن</span><span>·</span>"+
  "<span>آخرین به‌روزرسانی: <b>"+STATS.updated+"</b></span>";
const counts={}; POSTS.forEach(p=>{(p.collections||[]).forEach(c=>{counts[c]=(counts[c]||0)+1;});});
document.querySelectorAll(".chip").forEach(ch=>{
  const c=ch.dataset.c;
  if(c){ch.innerHTML=ch.textContent+' <span class="n">'+counts[c]+"</span>";}
  ch.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
    ch.classList.add("active"); activeC=c; render();
  });
});
document.getElementById("q").addEventListener("input",e=>{query=norm(e.target.value.trim());render();});
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function card(p){
  const letter=esc((p.username||"?").charAt(0).toUpperCase());
  const tags=(p.collections||[]).map(c=>'<span class="ctag">'+esc(c)+"</span>").join("");
  const needsMore=(p.caption_display||"").length>160;
  const capHtml=needsMore
    ?'<div class="excerpt">'+esc(p.excerpt)+'</div><details><summary class="more">نمایش کامل کپشن</summary><div class="full">'+esc(p.caption_display)+"</div></details>"
    :'<div class="excerpt">'+esc(p.excerpt)+"</div>";
  const analysisHtml=p.analysis_display?'<div class="analysis"><b class="alabel">تحلیل محتوا</b>'+esc(p.analysis_display)+"</div>":"";
  return '<div class="card">'
    +'<div class="thumb"><span class="letter">'+letter+'</span><span class="tbadge">'+esc(p.type_fa)+"</span></div>"
    +'<div class="body">'
    +'<div class="user"><a href="https://www.instagram.com/'+esc(p.username)+'/" target="_blank" rel="noopener">@'+esc(p.username)+"</a></div>"
    +capHtml+analysisHtml
    +'<div class="ctags">'+tags+"</div>"
    +'<a class="iglink" href="'+esc(p.url)+'" target="_blank" rel="noopener">مشاهده در اینستاگرام ↗</a>'
    +"</div></div>";
}
function render(){
  const grid=document.getElementById("grid");
  const q=query;
  const list=POSTS.filter(p=>{
    if(activeC && !(p.collections||[]).includes(activeC)) return false;
    if(q){const hay=norm((p.caption||"")+" "+(p.caption_fa||"")+" "+p.username+" "+(p.analysis||"")+" "+(p.analysis_fa||"")); if(!hay.includes(q)) return false;}
    return true;
  });
  grid.innerHTML=list.map(card).join("");
  document.getElementById("empty").style.display=list.length?"none":"block";
}
render();
</script>
